<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
      <!-- Outer Main Table -->
    <table border="1" cellpadding="10" cellspacing="0" width="100%">
        <!-- Top Row -->
        <tr>
            <!-- Top Left Cell: Contains Nested Table 2 -->
            <td width="50%">
                <table border="1" cellpadding="5" cellspacing="0" width="100%">
                    <tr>
                        <th colspan="2">Nested Table 2</th>
                    </tr>
                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                    </tr>
                    <tr>
                        <td>abc</td>
                        <td>def</td>
                    </tr>
                </table>
            </td>

            <!-- Top Right Cell: Contains Nested Table 1 -->
            <td width="50%">
                <table border="1" cellpadding="5" cellspacing="0" width="100%">
                    <tr>
                        <th>Nested Table 1</th>
                    </tr>
                    <tr>
                        <td>
                            <ul>
                                <li>List item</li>
                                <li>List item</li>
                                <li>List item</li>
                            </ul>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- Bottom Row -->
        <tr>
            <!-- Bottom Left Cell: Contains Nested Table 3 -->
            <td>
                <table border="1" cellpadding="5" cellspacing="0" width="100%">
                    <tr>
                        <th colspan="2">Nested Table 3</th>
                    </tr>
                    <tr>
                        <td><a href="#">Nested Table</a></td>
                        <td>Demo Continued</td>
                    </tr>
                </table>
            </td>

            <!-- Bottom Right Cell: Contains Nested Table 4 -->
            <td>
                <table border="1" cellpadding="5" cellspacing="0" width="100%">
                    <tr>
                        <th>Nested Table 4</th>
                    </tr>
                    <tr>
                        <td style="background-color: black; color: white; text-align: center; font-weight: bold;">
                            HTML
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
  </body>
</html>
